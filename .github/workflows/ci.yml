name: component-courts

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: make test
      - run: make bootstrap
      - run: make host-bootstrap

  dspy-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,dspy]"
      - run: make test
      - run: make dspy
      - run: python host.py dist/dspy.wasm --self-test
      - name: Host-backed Predict
        run: |
          python host.py dist/dspy.wasm \
            --predict-signature "question -> answer" \
            --inputs '{"question":"What is the capital of France?"}' \
            --response $'[[ ## answer ## ]]\nParis\n\n[[ ## completed ## ]]'
      - name: Capabilities
        run: python host.py dist/dspy.wasm --capabilities
      - name: Multi-hop retrieval pipeline
        run: |
          python host.py dist/dspy.wasm --run @examples/multihop_pipeline.json \
            --responses @examples/multihop_responses.json
      - name: CodeAct over host tools
        run: |
          python host.py dist/dspy.wasm --run @examples/code_act.json \
            --responses @examples/code_act_responses.json
      - name: Compile with BootstrapFewShot
        run: |
          python host.py dist/dspy.wasm --compile @examples/compile_bootstrap.json \
            --responses @examples/compile_responses.json
