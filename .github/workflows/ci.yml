name: component-courts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: Build the WASI toolchain and wheels from scratch (no cache restore)
        type: boolean
        default: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Build first so the bootstrap deadline tests run instead of skipping.
      - run: make bootstrap
      - run: make test
      - run: make host-bootstrap

  dspy-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Rust toolchain for wasm32-wasip2
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-wasip2
      - run: python -m pip install -e ".[dev,dspy]"
      # Build first: without dist/bootstrap.wasm the two epoch-deadline tests
      # skip, and this job (the only one with dspy) then runs 212 of 214.
      - run: make bootstrap
      - run: make test
        env:
          DSPY_WASM_FORBID_SKIPS: "1"
      - run: rustc --version && cargo --version

      # wasi-sdk, CPython 3.14 for WASI, zlib, libyaml, OpenSSL, componentize-py.
      - name: Cache WASI toolchain
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: build/wasi
          key: wasi-toolchain-${{ hashFiles('wasi/toolchain.sh') }}
      - run: make wasi-toolchain

      # Every native dependency cross-compiled from source.
      - name: Cache WASI wheels
        if: ${{ !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: |
            build/wasi_wheels
            build/sdists
          key: wasi-wheels-${{ hashFiles('wasi/**') }}
      - name: Build WASI wheels
        run: |
          python wasi/build_wheels.py fetch
          python wasi/build_wheels.py build --missing
      - run: python wasi/build_wheels.py install

      - run: make dspy
      - name: Pack consumer artifact
        run: |
          sha256sum dist/dspy.wasm > dist/dspy.wasm.sha256
          cp wit/dspy.wit dist/dspy.wit
          cp consumer/contract.json dist/contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: dspy-wasm-${{ github.sha }}
          path: |
            dist/dspy.wasm
            dist/dspy.wasm.sha256
            dist/dspy.wit
            dist/contract.json
          if-no-files-found: error
          retention-days: 30
      - run: python host.py dist/dspy.wasm --self-test
      - name: Conformance suite
        run: python host.py dist/dspy.wasm --conformance
      - name: Host budget aborts a runaway compile
        run: |
          if python host.py dist/dspy.wasm --compile @examples/compile_bootstrap.json \
              --responses @examples/compile_responses.json --max-lm-calls 1; then
            echo "budget was not enforced"; exit 1
          else
            test $? -eq 3
          fi
      - name: Host-backed Predict
        run: |
          python host.py dist/dspy.wasm \
            --predict-signature "question -> answer" \
            --inputs '{"question":"What is the capital of France?"}' \
            --response $'[[ ## answer ## ]]\nParis\n\n[[ ## completed ## ]]'
      - name: Capabilities
        run: python host.py dist/dspy.wasm --capabilities
      - name: Multi-hop retrieval pipeline
        run: |
          python host.py dist/dspy.wasm --run @examples/multihop_pipeline.json \
            --responses @examples/multihop_responses.json
      - name: CodeAct over host tools
        run: |
          python host.py dist/dspy.wasm --run @examples/code_act.json \
            --responses @examples/code_act_responses.json
      - name: Compile with BootstrapFewShot
        run: |
          python host.py dist/dspy.wasm --compile @examples/compile_bootstrap.json \
            --responses @examples/compile_responses.json
